name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y             libegl1             libgl1             libxkbcommon-x11-0             libxcb-cursor0             libnss3             libxcomposite1             libxdamage1             libxrandr2             libxtst6

      - name: Install
        shell: bash
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,hatanaka,unix-z]"

      - name: Unit tests
        shell: bash
        run: pytest -q -m "not integration"

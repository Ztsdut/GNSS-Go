name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          for attempt in 1 2 3; do
            echo "apt-get update attempt ${attempt}/3"
            if sudo apt-get update               -o Acquire::Retries=5               -o Acquire::http::Timeout=30               -o Acquire::https::Timeout=30; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "apt-get update failed after 3 attempts"
              exit 1
            fi

            sleep 10
          done

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             libegl1             libgl1             libxkbcommon-x11-0             libxcb-cursor0             libnss3             libxcomposite1             libxdamage1             libxrandr2             libxtst6

      - name: Install
        shell: bash
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,hatanaka,unix-z]"

      - name: Unit tests
        shell: bash
        run: pytest -q -m "not integration"
